name: 编译Whl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022  # 修正为有效的运行环境
    strategy:
      matrix:
        python-version: ['3.13']
    name: 当Python环境为 ${{ matrix.python-version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5  # 升级到最新版本
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装构建工具
        run: |
          # 安装Visual Studio构建工具
          choco install visualstudio2022buildtools -y
          choco install visualstudio2022-workload-nativedesktop -y
          
          # 安装CMake
          choco install cmake --version=3.18.4 -y
          
          # 安装MySQL客户端库
          choco install mysql-connector-c -y

      - name: 设置MySQL环境变量
        run: |
          # 设置MySQL头文件和库路径
          $mysqlPath = "C:\Program Files\MySQL\MySQL Connector C 8.0"
          echo "MYSQL_DIR=$mysqlPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=$mysqlPath\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$mysqlPath\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel cython

      - name: 克隆asyncmy仓库
        run: git clone https://github.com/long2ice/asyncmy.git

      - name: 构建Whl包
        run: |
          cd asyncmy
          # 设置编译环境
          $env:INCLUDE = "$env:MYSQL_DIR\include;$env:INCLUDE"
          $env:LIB = "$env:MYSQL_DIR\lib;$env:LIB"
          python -m build --wheel

      - name: 验证构建结果
        run: |
          cd asyncmy/dist
          dir

      - name: 上传文件
        uses: actions/upload-artifact@v4
        with: 
          name: whl-python${{ matrix.python-version }}
          path: asyncmy/dist/*.whl
